<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Prototype</title>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="room-controls">
          <input id="name" maxlength="8" placeholder="NAME" autocomplete="off" />
          <button id="create">Create room</button>
          <input id="room" maxlength="8" placeholder="ROOM CODE" autocomplete="off" />
          <button id="join">Join</button>
          <button id="copy" hidden>Copy link</button>
        </div>
        <p id="status">Create a room to start.</p>
      </header>

      <section id="game-wrap" class="game-wrap">
        <div class="play-area">
          <div class="canvas-wrap">
            <canvas id="game" width="900" height="600"></canvas>
            <p class="controls-hint">WASD / arrows to move · Tab to toggle inventory</p>
          </div>
        </div>
        <aside id="inventory" class="inventory" hidden aria-labelledby="inventory-title">
          <h2 id="inventory-title">Inventory</h2>
          <ol id="inventory-slots"></ol>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
